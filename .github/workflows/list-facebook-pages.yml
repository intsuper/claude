name: List Facebook pages

# One-off helper to discover your Facebook Page ID. Runs in CI so the
# access token stays in GitHub Secrets and never enters a chat session.
# Trigger from: Actions -> List Facebook pages -> Run workflow.
# Then copy the printed FACEBOOK_PAGE_ID into a new repository secret.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List pages
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_API_VERSION: ${{ secrets.FACEBOOK_API_VERSION }}
        run: python -m comment_reader.list_pages
