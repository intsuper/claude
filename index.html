<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Creative Altitude</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<style>
/* ============================================================
   CREATIVE ALTITUDE — the weekly creative operating system
   Palette: cool deep-ink cockpit. Accent (indigo) = THE GOAL.
   Semantic green/red/amber reserved for winner/loser/iterate.
   ============================================================ */

:root{
  /* light theme (default, un-stamped covered by media query below) */
  --bg:#eef1f5;
  --surface:#ffffff;
  --surface-2:#f4f6f9;
  --panel:#ffffff;
  --inset:#f0f3f7;
  --border:#dde3ea;
  --border-strong:#c6d0db;
  --ink:#111821;
  --ink-2:#46535f;
  --ink-3:#75828f;
  --accent:#3f57ff;
  --accent-ink:#ffffff;
  --accent-soft:rgba(63,87,255,.10);
  --good:#0f9d58;
  --good-2:#0b7c44;
  --bad:#e0413f;
  --bad-2:#c22f2d;
  --warn:#c67a10;
  --warn-2:#a86308;
  --good-soft:rgba(15,157,88,.12);
  --bad-soft:rgba(224,65,63,.12);
  --warn-soft:rgba(198,122,16,.13);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.18);
  --shadow-lift:0 2px 6px rgba(16,24,40,.06),0 20px 40px -20px rgba(16,24,40,.28);
  --rail-w:250px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0d12;
    --surface:#12171f;
    --surface-2:#161d27;
    --panel:#12171f;
    --inset:#0d1219;
    --border:#232c38;
    --border-strong:#33404f;
    --ink:#e9eef4;
    --ink-2:#a3b1c0;
    --ink-3:#6c7b8b;
    --accent:#7089ff;
    --accent-ink:#0a0d12;
    --accent-soft:rgba(112,137,255,.14);
    --good:#35c77d;
    --good-2:#54d78f;
    --bad:#ff5f60;
    --bad-2:#ff7d7d;
    --warn:#eaa63a;
    --warn-2:#f4bc63;
    --good-soft:rgba(53,199,125,.14);
    --bad-soft:rgba(255,95,96,.14);
    --warn-soft:rgba(234,166,58,.15);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lift:0 2px 6px rgba(0,0,0,.4),0 24px 50px -22px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0d12;
  --surface:#12171f;
  --surface-2:#161d27;
  --panel:#12171f;
  --inset:#0d1219;
  --border:#232c38;
  --border-strong:#33404f;
  --ink:#e9eef4;
  --ink-2:#a3b1c0;
  --ink-3:#6c7b8b;
  --accent:#7089ff;
  --accent-ink:#0a0d12;
  --accent-soft:rgba(112,137,255,.14);
  --good:#35c77d;
  --good-2:#54d78f;
  --bad:#ff5f60;
  --bad-2:#ff7d7d;
  --warn:#eaa63a;
  --warn-2:#f4bc63;
  --good-soft:rgba(53,199,125,.14);
  --bad-soft:rgba(255,95,96,.14);
  --warn-soft:rgba(234,166,58,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4),0 24px 50px -22px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:"Archivo",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-family:"Archivo",sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;color:var(--ink-3)}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100vh}

/* ---------- stage rail ---------- */
.rail{
  border-right:1px solid var(--border);
  background:var(--surface);
  padding:22px 18px;
  position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;gap:20px;
}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{
  width:34px;height:34px;border-radius:9px;flex:none;position:relative;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#b7c4ff));
  box-shadow:0 6px 16px -6px var(--accent);
}
.brand .mark::after{
  content:"";position:absolute;inset:0;border-radius:9px;
  background:
    linear-gradient(to top,var(--accent-ink) 0 2px,transparent 2px) bottom/100% 100% no-repeat;
  -webkit-mask:linear-gradient(140deg,transparent 38%,#000 38%);mask:linear-gradient(140deg,transparent 38%,#000 38%);
  opacity:.28;
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.brand p{margin:2px 0 0;font-size:11px;color:var(--ink-3);letter-spacing:.02em}

.stages{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.stage-item{
  display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:start;
  padding:11px 11px;border-radius:11px;border:1px solid transparent;
  background:transparent;width:100%;text-align:left;color:var(--ink-2);
  position:relative;transition:background .12s,border-color .12s;
}
.stage-item:not(:disabled):hover{background:var(--surface-2)}
.stage-item.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,transparent)}
.stage-item:disabled{cursor:not-allowed;opacity:.55}
.stage-item .num{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  background:var(--inset);border:1px solid var(--border);color:var(--ink-2);
}
.stage-item.active .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage-item.done .num{background:var(--good);border-color:var(--good);color:#fff}
.stage-item.done .num::after{content:"✓";font-family:sans-serif}
.stage-item.done .num span{display:none}
.stage-item .body{min-width:0;padding-top:1px}
.stage-item .t{font-family:"Archivo",sans-serif;font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.2;letter-spacing:-.01em}
.stage-item:disabled .t{color:var(--ink-2)}
.stage-item .s{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.3}
.stage-item .lock{position:absolute;top:12px;right:11px;font-size:11px;color:var(--ink-3)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.rail-foot .wk{font-size:11.5px;color:var(--ink-3)}
.ghostbtn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);
  border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600;
}
.ghostbtn:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 30px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);
}
.topbar .crumb{font-family:"Archivo",sans-serif;font-weight:700;font-size:15px}
.topbar .crumb .idx{color:var(--ink-3);font-weight:600;margin-right:8px}
.topbar .spacer{flex:1}
.seg{display:inline-flex;background:var(--inset);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{
  border:none;background:transparent;color:var(--ink-2);font-weight:600;font-size:12.5px;
  padding:6px 13px;border-radius:7px;
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.iconbtn{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:15px;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;letter-spacing:.01em;
  box-shadow:0 8px 20px -12px var(--accent);
}
.btn:hover{filter:brightness(1.05)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--border-strong);box-shadow:none}
.btn.secondary:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.canvas{padding:28px 30px 64px;max-width:1180px;width:100%}
.stage-head{margin-bottom:22px}
.stage-head .eyebrow{color:var(--accent)}
.stage-head h2{font-size:27px;font-weight:800;margin-top:9px;letter-spacing:-.02em}
.stage-head p{color:var(--ink-2);margin:8px 0 0;max-width:64ch;font-size:14.5px}

.sample-banner{
  display:flex;align-items:center;gap:11px;
  border:1px dashed var(--border-strong);background:var(--surface-2);
  border-radius:11px;padding:10px 14px;margin-bottom:22px;font-size:13px;color:var(--ink-2);
}
.sample-banner b{color:var(--ink)}
.sample-banner button{margin-left:auto}

/* ---------- goal gauge (hero) ---------- */
.goal{
  background:var(--panel);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:24px 26px;margin-bottom:20px;position:relative;overflow:hidden;
}
.goal::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}
.goal-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.goal-lede .eyebrow{color:var(--accent)}
.goal-lede h3{font-size:18px;font-weight:800;margin-top:7px}
.goal-lede p{margin:5px 0 0;color:var(--ink-3);font-size:13px}
.goal-figure{text-align:right}
.goal-figure .big{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em}
.goal-figure .sub{font-size:13px;color:var(--ink-3);margin-top:6px}
.goal-figure .sub b{color:var(--ink);font-weight:600}

.track{margin-top:28px;position:relative;height:26px;border-radius:8px;background:var(--inset);border:1px solid var(--border);overflow:visible}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:7px 0 0 7px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 78%,#000 6%),var(--accent));
  transition:width .5s cubic-bezier(.2,.7,.2,1)}
.track .fill.over{background:linear-gradient(90deg,var(--good-2),var(--good))}
.track .goalmark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55}
.track .goalmark::after{content:"$5K/day goal";position:absolute;top:-19px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:10.5px;font-weight:700;color:var(--ink-2);font-family:"Archivo",sans-serif;letter-spacing:.02em}
.track-scale{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--ink-3)}

.goal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:22px;border-top:1px solid var(--border);padding-top:18px}
.goal-stats .gs{padding:0 18px;border-left:1px solid var(--border)}
.goal-stats .gs:first-child{padding-left:0;border-left:none}
.goal-stats .gs .k{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.goal-stats .gs .v{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
.goal-stats .gs .n{font-size:12px;margin-top:3px;color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.dot.acc{background:var(--accent)}
.v.good{color:var(--good-2)}.v.bad{color:var(--bad-2)}

/* ---------- section titles ---------- */
.sec-title{display:flex;align-items:baseline;gap:12px;margin:30px 2px 14px}
.sec-title h3{font-size:16px;font-weight:800}
.sec-title .hint{font-size:12.5px;color:var(--ink-3)}
.sec-title .hint b{color:var(--ink-2);font-weight:600}

/* ---------- product pillar cards ---------- */
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.pcard{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;
}
.pcard .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pcard .pname{font-family:"Archivo",sans-serif;font-weight:700;font-size:15.5px;line-height:1.15}
.pcard .pspend{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.verdict{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  padding:4px 8px;border-radius:999px;white-space:nowrap;flex:none}
.verdict.win{background:var(--good-soft);color:var(--good-2)}
.verdict.mix{background:var(--warn-soft);color:var(--warn-2)}
.verdict.bleed{background:var(--bad-soft);color:var(--bad-2)}

.pillars{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;height:150px;padding-top:6px}
.pillar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:0}
.pillar .col{width:100%;max-width:82px;border-radius:8px 8px 3px 3px;position:relative;display:flex;align-items:flex-start;justify-content:center;
  min-height:20px;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.pillar .col .cnt{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:19px;color:#fff;margin-top:7px}
.pillar.w .col{background:linear-gradient(180deg,var(--good),var(--good-2))}
.pillar.l .col{background:linear-gradient(180deg,var(--bad),var(--bad-2))}
.pillar .lab{margin-top:9px;text-align:center}
.pillar .lab .n{font-family:"Archivo",sans-serif;font-weight:700;font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.pillar.w .lab .n{color:var(--good-2)}.pillar.l .lab .n{color:var(--bad-2)}
.pillar .lab .sp{font-size:11px;color:var(--ink-3);margin-top:2px}
.pcard .pfoot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:11px;font-size:11.5px;color:var(--ink-3)}
.ratio-bar{flex:1;height:6px;border-radius:99px;background:var(--bad-soft);overflow:hidden}
.ratio-bar i{display:block;height:100%;background:var(--good);border-radius:99px}

/* ---------- recommendations ---------- */
.recs{display:flex;flex-direction:column;gap:12px}
.rec{
  display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);
  border-left:4px solid var(--pl,var(--accent));
}
.rec .rank{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;color:var(--ink-3);text-align:center}
.rec .rmid{min-width:0}
.rec .rtag{display:inline-flex;align-items:center;gap:7px;font-family:"Archivo",sans-serif;font-weight:700;
  font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.rec .rtitle{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;line-height:1.25}
.rec .rwhy{font-size:13px;color:var(--ink-2);margin-top:5px}
.rec .rwhy b{color:var(--ink);font-weight:600}
.rec .rimpact{text-align:right;white-space:nowrap}
.rec .rimpact .k{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-family:"Archivo",sans-serif;font-weight:700}
.rec .rimpact .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px;margin-top:3px}
.tag-cut{background:var(--bad-soft);color:var(--bad-2)} .b-cut{--pl:var(--bad)}
.tag-scale{background:var(--good-soft);color:var(--good-2)} .b-scale{--pl:var(--good)}
.tag-more{background:var(--accent-soft);color:var(--accent)} .b-more{--pl:var(--accent)}
.tag-iterate{background:var(--warn-soft);color:var(--warn-2)} .b-iterate{--pl:var(--warn)}

.stage-cta{display:flex;align-items:center;gap:14px;margin-top:28px;padding:18px 20px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--border)}
.stage-cta .txt{font-size:13.5px;color:var(--ink-2)}
.stage-cta .txt b{color:var(--ink)}
.stage-cta .spacer{flex:1}

/* ---------- stage 2 focus ---------- */
.focus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.focus-opt{text-align:left;background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:9px;transition:border-color .12s,transform .12s}
.focus-opt:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.focus-opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.focus-opt .fo-top{display:flex;align-items:center;justify-content:space-between}
.focus-opt .fo-prod{font-size:12px;color:var(--ink-3)}
.focus-opt .fo-title{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px}
.focus-opt .fo-why{font-size:12.5px;color:var(--ink-2)}
.focus-opt .fo-metric{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}

/* ---------- stage 3 decisions ---------- */
.dtable{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.dtable th{font-family:"Archivo",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;color:var(--ink-3);
  text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;background:var(--surface-2)}
.dtable td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.dtable tr:last-child td{border-bottom:none}
.dtable .num{text-align:right}
.roas-pill{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;padding:3px 9px;border-radius:7px}
.roas-pill.w{background:var(--good-soft);color:var(--good-2)}
.roas-pill.l{background:var(--bad-soft);color:var(--bad-2)}
.decide{display:inline-flex;gap:4px;background:var(--inset);border:1px solid var(--border);border-radius:9px;padding:3px}
.decide button{border:none;background:transparent;color:var(--ink-3);font-weight:600;font-size:11.5px;padding:5px 9px;border-radius:6px}
.decide button.on[data-d="scale"]{background:var(--good);color:#fff}
.decide button.on[data-d="cut"]{background:var(--bad);color:#fff}
.decide button.on[data-d="iterate"]{background:var(--warn);color:#fff}
.decide button.on[data-d="keep"]{background:var(--ink-2);color:var(--surface)}

/* ---------- stage 4 tasks / stage 5 commit ---------- */
.tasklist{display:flex;flex-direction:column;gap:10px}
.taskrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.taskrow input{width:19px;height:19px;accent-color:var(--accent)}
.taskrow .tt{font-size:14px}.taskrow.done .tt{text-decoration:line-through;color:var(--ink-3)}
.taskrow .tk{font-family:"Archivo",sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.sumcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.sumcard .k{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-family:"Archivo",sans-serif;font-weight:700}
.sumcard .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:28px;margin-top:8px;letter-spacing:-.01em}
.sumcard .n{font-size:12.5px;color:var(--ink-2);margin-top:5px}

.locked-panel{display:grid;place-items:center;min-height:50vh;text-align:center}
.locked-panel .lk{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2);
  border:1px solid var(--border);font-size:26px;margin:0 auto 18px}
.locked-panel h2{font-size:22px}
.locked-panel p{color:var(--ink-2);max-width:44ch;margin:10px auto 20px}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,9,14,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);background:var(--surface);
  border-left:1px solid var(--border);z-index:61;transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lift)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.drawer .dh h3{font-size:16px;font-weight:800}.drawer .dh .spacer{flex:1}
.drawer .db{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.prod-edit{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--panel)}
.prod-edit .pe-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number]{
  font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--inset);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;
}
input.mono{font-family:"IBM Plex Mono",monospace}
input:focus,button:focus-visible,.stage-item:focus-visible,.focus-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cr-row{display:grid;grid-template-columns:1fr 84px 74px 30px;gap:8px;align-items:center;margin-bottom:8px}
.cr-row .lblrow{display:contents}
.mini{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.xbtn{border:1px solid var(--border);background:var(--surface);color:var(--ink-3);border-radius:7px;width:30px;height:32px;font-size:14px}
.xbtn:hover{color:var(--bad);border-color:var(--bad)}
.addlink{background:none;border:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:4px 0;text-align:left}
.drawer .df{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);z-index:80;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lift);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column;border-right:none;border-bottom:1px solid var(--border)}
  .stages{flex-direction:row;overflow:auto;padding-bottom:4px}
  .stage-item{min-width:210px}
  .rail-foot{margin-top:12px}
  .goal-figure{text-align:left}
  .goal-stats{grid-template-columns:1fr;gap:14px}
  .goal-stats .gs{padding:0;border-left:none}
}
/* ---------- creative research (tab 2) ---------- */
.research-top{display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px 22px;margin-bottom:22px}
.rt-figure{display:flex;flex-direction:column;gap:3px}
.rt-figure .k{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-family:"Archivo"}
.rt-figure .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;letter-spacing:-.01em}
.rt-figure input{width:70px;text-align:center;font-size:17px;font-weight:600;padding:5px 6px}
.rt-prog{flex:1;min-width:190px}
.rt-prog .bar{height:10px;border-radius:99px;background:var(--inset);border:1px solid var(--border);overflow:hidden}
.rt-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 80%,#000 6%),var(--accent));border-radius:99px;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.rt-prog .lab{font-size:11.5px;color:var(--ink-3);margin-top:7px}

.builder{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:28px}
.builder-h{display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.builder-h h3{font-size:15px;font-weight:800}
.builder-h .spacer{flex:1}
.bstep{padding:19px 22px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:140px 1fr;gap:20px}
.bstep .bs-num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);font-weight:600}
.bstep .bs-t{font-family:"Archivo",sans-serif;font-weight:700;font-size:14px;margin-top:4px;line-height:1.2}
.bstep .bs-s{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.35}
.bstep .bs-body{min-width:0}
.bstep.locked{opacity:.45;pointer-events:none;filter:grayscale(.3)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;line-height:1.1}
.chip:hover{background:var(--surface-2);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px -8px var(--accent)}
.chip.used{opacity:.5}
.chip .u{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3);border:1px solid var(--border);border-radius:5px;padding:1px 4px}
.chip.on .u{color:var(--accent-ink);border-color:currentColor;opacity:.8}
.chip-add{border:1px dashed var(--border-strong);background:transparent;color:var(--ink-2);border-radius:999px;padding:7px 13px;font-size:12.5px;width:108px}
.chip-add::placeholder{color:var(--ink-3)}
.chip-add:focus{border-style:solid;border-color:var(--accent);outline:none}
.aud-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.aud-card{text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.aud-card:hover{border-color:var(--border-strong)}
.aud-card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.aud-card .ac-code{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--accent)}
.aud-card .ac-t{font-weight:700;font-size:13.5px;font-family:"Archivo",sans-serif}
.aud-card .ac-s{font-size:11.5px;color:var(--ink-3)}
.insp-row{display:flex;flex-direction:column;gap:12px}
.insp-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linklike{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--border-strong);border-radius:9px;padding:7px 12px}
.linklike:hover{background:var(--accent-soft)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.name-out{background:var(--inset);border:1px solid var(--border);border-radius:12px;padding:15px 18px}
.name-out .no-k,.brief-out .no-k{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.name-out .no-v{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;margin-top:10px;word-break:break-word;line-height:1.6;color:var(--ink)}
.name-out .no-v .miss{color:var(--bad-2);background:var(--bad-soft);padding:1px 7px;border-radius:5px;font-size:12px;font-weight:600}
.brief-out{background:var(--surface);border:1px dashed var(--border-strong);border-radius:12px;padding:15px 18px;margin-top:12px}
.brief-out dl{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;margin:0}
.brief-out dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-family:"Archivo",sans-serif;padding-top:1px}
.brief-out dd{margin:0;font-size:13.5px;color:var(--ink);word-break:break-word}
.builder-foot{display:flex;align-items:center;gap:12px;padding:16px 22px;background:var(--surface-2);border-top:1px solid var(--border)}
.builder-foot .spacer{flex:1}
.copybtn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600}
.copybtn:hover{background:var(--surface-2);color:var(--ink)}
.built-list{display:flex;flex-direction:column;gap:12px}
.adrow{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:15px 18px;display:flex;flex-direction:column;gap:11px}
.adrow .ar-top{display:flex;align-items:center;gap:12px}
.adrow .ar-name{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;word-break:break-word;flex:1;min-width:0}
.adrow .ar-chips{display:flex;flex-wrap:wrap;gap:6px}
.minichip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--inset);border:1px solid var(--border);color:var(--ink-2)}
.minichip.prod{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.adrow .ar-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:11px}
.adrow .ar-foot .spacer{flex:1}
.empty{text-align:center;color:var(--ink-3);padding:38px 24px;border:1px dashed var(--border-strong);border-radius:14px;font-size:13.5px;line-height:1.5}
@media (max-width:720px){.bstep{grid-template-columns:1fr;gap:12px}}

/* strategy card + thumbnail */
.strat-card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px}
.strat-icon{font-size:21px;width:42px;height:42px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.strat-main{flex:1;min-width:0}
.strat-t{font-family:"Archivo",sans-serif;font-weight:700;font-size:15px}
.strat-s{font-size:12px;color:var(--ink-3);margin-top:2px}
.strat-actions{display:flex;gap:8px;align-items:center;flex:none}
.strat-card{margin-bottom:12px}
.strat-lib{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.strat-item{display:flex;align-items:stretch;border:1px solid var(--border-strong);border-radius:11px;overflow:hidden;background:var(--surface)}
.strat-item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.strat-pick{border:none;background:transparent;text-align:left;padding:8px 12px;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.strat-pick:not(:disabled):hover{background:var(--surface-2)}
.strat-pick:disabled{cursor:default}
.strat-item.on .strat-pick{background:var(--accent-soft)}
.si-name{font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;line-height:1.1}
.si-meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.strat-item.on .si-meta{color:var(--accent)}
.si-del{border:none;border-left:1px solid var(--border);background:transparent;color:var(--ink-3);width:30px;font-size:12px}
.si-del:hover{color:var(--bad);background:var(--bad-soft)}
.strat-upload{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.strat-upload input[type=text]{width:100%}
.su-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.su-picked{font-size:12px;color:var(--ink-3)}
.strat-upload textarea{width:100%;min-height:130px;resize:vertical;font-family:inherit;font-size:13px;color:var(--ink);background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:10px}
.strat-upload textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.su-foot{display:flex;gap:8px;justify-content:flex-end}
.thumb-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thumb-drop{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--border-strong);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.thumb-drop:hover{border-color:var(--accent);color:var(--accent)}
.thumb-prev{display:flex;align-items:center;gap:12px}
.thumb-prev img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.brief-thumb{width:118px;height:118px;object-fit:cover;border-radius:10px;border:1px solid var(--border);float:right;margin:0 0 10px 16px}
.adrow .ar-thumb{width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex:none}

/* acquisition split on product card */
.pcard.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.pcard.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--border-strong)}
.pcard.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acq-row{border-top:1px solid var(--border);padding-top:11px;margin-top:2px}
.acq-head{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-bottom:6px}
.acq-src{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-family:"Archivo",sans-serif}
.acq-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--inset)}
.acq-bar.big{height:14px;margin-top:4px}
.acq-bar i{display:block;height:100%}
.acq-bar .acq-new{background:var(--accent)}
.acq-bar .acq-ret{background:color-mix(in srgb,var(--ink-3) 45%,transparent)}
.acq-legend{display:flex;gap:14px;margin-top:7px;font-size:11px;color:var(--ink-2)}
.acq-legend .d{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.acq-legend .d.new{background:var(--accent)}
.acq-legend .d.ret{background:color-mix(in srgb,var(--ink-3) 45%,transparent)}
.pcard-cta{font-family:"Archivo",sans-serif;font-size:11.5px;font-weight:700;color:var(--accent);margin-top:11px;letter-spacing:.01em}

/* product detail modal */
.pm-scrim{position:fixed;inset:0;background:rgba(6,9,14,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.pm-scrim.open{opacity:1;pointer-events:auto}
.pmodal{position:fixed;z-index:71;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;
  width:min(640px,94vw);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow-lift);transition:opacity .2s,transform .2s}
.pmodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.pm-close{position:absolute;top:14px;right:14px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);width:32px;height:32px;border-radius:8px;font-size:14px;z-index:2}
.pm-close:hover{background:var(--surface-2);color:var(--ink)}
.pm-body{padding:22px 24px}
.pm-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px;padding-right:34px}
.pm-name{font-family:"Archivo",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.01em}
.pm-sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.pm-section{margin-bottom:22px}
.pm-h{font-family:"Archivo",sans-serif;font-weight:700;font-size:14px;display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.pm-h .acq-src{margin-left:auto}
.pm-legend{font-size:11.5px;color:var(--ink-3);margin-bottom:10px}
.angle-tbl{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.angle-tbl th{font-family:"Archivo",sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:10px;color:var(--ink-3);text-align:left;padding:9px 13px;background:var(--surface-2);border-bottom:1px solid var(--border);font-weight:700}
.angle-tbl td{padding:9px 13px;border-bottom:1px solid var(--border);font-size:13px}
.angle-tbl tr:last-child td{border-bottom:none}
.angle-tbl .num{text-align:right}
.angle-tbl .mono.lo{color:var(--bad-2)}
.astat{display:inline-flex;align-items:center;gap:5px;font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:999px}
.astat.winning{background:var(--good-soft);color:var(--good-2)}
.astat.losing{background:var(--bad-soft);color:var(--bad-2)}
.astat.testing{background:var(--warn-soft);color:var(--warn-2)}
.astat.untested{background:var(--accent-soft);color:var(--accent)}
.pm-foot{font-size:12px;color:var(--ink-3);border-top:1px solid var(--border);padding-top:14px;line-height:1.5}
.pm-foot b{color:var(--warn-2)}

/* angle status dot inside chips + key */
.astat-dot{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;border-radius:5px;font-size:10px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.astat-dot.winning{background:var(--good);color:#fff}
.astat-dot.losing{background:var(--bad);color:#fff}
.astat-dot.testing{background:var(--warn);color:#fff}
.astat-dot.untested{background:var(--accent-soft);color:var(--accent)}
.chip.on .astat-dot.untested{background:rgba(255,255,255,.28);color:#fff}
.angle-key{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:11px;font-size:11px;color:var(--ink-3)}
.angle-key .astat-dot{margin-right:2px}
.angle-key .sep{color:var(--border-strong);margin:0 4px}

/* brief score card */
.scorecard{display:grid;grid-template-columns:150px 1fr;gap:18px;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;align-items:center}
.scorecard.s-good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.scorecard.s-warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.scorecard.s-bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.score-num{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.score-num .sn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:46px;letter-spacing:-.02em}
.s-good .score-num .sn{color:var(--good-2)}.s-warn .score-num .sn{color:var(--warn-2)}.s-bad .score-num .sn{color:var(--bad-2)}
.score-num .sd{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3);margin-top:-4px}
.score-num .score-label{font-family:"Archivo",sans-serif;font-weight:700;font-size:12.5px;margin-top:8px;color:var(--ink)}
.score-factors{display:flex;flex-direction:column;gap:9px}
.sf-h{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.sf-bar{height:5px;border-radius:99px;background:color-mix(in srgb,var(--ink-3) 22%,transparent);margin:4px 0 3px;overflow:hidden}
.sf-bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.s-good .sf-bar i{background:var(--good)}.s-warn .sf-bar i{background:var(--warn)}.s-bad .sf-bar i{background:var(--bad)}
.sf-n{font-size:11px;color:var(--ink-3);line-height:1.35}
.score-empty{border:1px dashed var(--border-strong);border-radius:12px;padding:14px 16px;font-size:12.5px;color:var(--ink-3);margin-bottom:14px}
.score-badge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;flex:none}
.score-badge.s-good{background:var(--good-soft);color:var(--good-2)}
.score-badge.s-warn{background:var(--warn-soft);color:var(--warn-2)}
.score-badge.s-bad{background:var(--bad-soft);color:var(--bad-2)}
@media (max-width:600px){.scorecard{grid-template-columns:1fr}}

/* ---------- Script Studio (tab 3) ---------- */
.ss-summary{display:flex;align-items:center;gap:26px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px 22px;margin-bottom:18px}
.ss-fig{display:flex;flex-direction:column;gap:3px}
.ss-fig .k{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-family:"Archivo",sans-serif}
.ss-fig .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;letter-spacing:-.01em}
.ss-prog{flex:1;min-width:180px}
.ss-prog .bar{height:10px;border-radius:99px;background:var(--inset);border:1px solid var(--border);overflow:hidden}
.ss-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good-2),var(--good));border-radius:99px;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.ss-prog .lab{font-size:11.5px;color:var(--ink-3);margin-top:7px}
.ss-filters{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.ss-frow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ss-flabel{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);width:58px;flex:none}
.seg2{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--inset);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg2.wrap{flex-wrap:wrap}
.seg2b{border:none;background:transparent;color:var(--ink-2);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:7px}
.seg2b:hover{color:var(--ink)}
.seg2b.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.ss-cards{display:flex;flex-direction:column;gap:14px}
.scard{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border-strong);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.scard.s-brief{border-left-color:var(--warn)}
.scard.s-editing{border-left-color:var(--accent)}
.scard.s-ready{border-left-color:var(--good)}
.sc-top{display:flex;align-items:flex-start;gap:14px}
.sc-thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--border);flex:none}
.sc-thumb.ph{display:grid;place-items:center;background:var(--inset);font-size:24px}
.sc-head{flex:1;min-width:0}
.sc-name{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;word-break:break-word;margin-bottom:8px}
.sc-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc-status{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:5px 11px;border-radius:999px;white-space:nowrap;flex:none;align-self:flex-start}
.sc-status.s-brief{background:var(--warn-soft);color:var(--warn-2)}
.sc-status.s-editing{background:var(--accent-soft);color:var(--accent)}
.sc-status.s-ready{background:var(--good-soft);color:var(--good-2)}
.sc-brief{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 13px}
.sc-b b{font-weight:700;color:var(--ink-3);text-transform:uppercase;font-size:10px;letter-spacing:.04em;font-family:"Archivo",sans-serif;margin-right:6px}
.sc-b a{color:var(--accent);font-weight:600}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sc-field label{display:block;font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.ss-ok{color:var(--good-2);text-transform:none;letter-spacing:0;font-weight:700}
.ss-req{color:var(--warn-2);text-transform:none;letter-spacing:0;font-weight:700}
.ss-sub{color:var(--ink-3);text-transform:none;letter-spacing:0;font-weight:500;font-size:10.5px}
.sc-uploads{display:flex;align-items:center;gap:12px}
.up-btn{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--border-strong);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.up-btn:hover{border-color:var(--accent);color:var(--accent)}
.linkbtn{border:none;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:0;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.sc-file{display:flex;align-items:center;gap:10px;font-size:13px;background:var(--inset);border:1px solid var(--border);border-radius:9px;padding:9px 12px}
.sc-file .spacer{flex:1}
.sc-paste{width:100%;min-height:120px;margin-top:8px;resize:vertical;font-family:inherit;font-size:13px;color:var(--ink);background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:10px}
.sc-visuals{border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.sc-visuals summary{cursor:pointer;padding:11px 15px;font-size:12.5px;font-weight:600;color:var(--ink-2);list-style:none}
.sc-visuals summary::-webkit-details-marker{display:none}
.sc-visuals summary:hover{color:var(--ink)}
.sc-visuals[open] summary{border-bottom:1px solid var(--border)}
.sc-vgrid{padding:14px 15px;display:flex;flex-direction:column;gap:10px}
.sc-vgrid textarea{min-height:80px;resize:vertical;font-family:inherit;font-size:13px;color:var(--ink);background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:10px}
.sc-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px}
.sc-foot .spacer{flex:1}
.sc-hint{font-size:12.5px;color:var(--ink-3)}
.frame-row{flex:1;min-width:220px;display:flex;flex-direction:column;gap:5px}
.frame-row label{font-size:10.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.frame-done{font-size:13.5px;color:var(--ink)}
.frame-done a{color:var(--accent);font-weight:600}
.script-pre{white-space:pre-wrap;word-break:break-word;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.6;background:var(--inset);border:1px solid var(--border);border-radius:10px;padding:16px;max-height:60vh;overflow:auto;color:var(--ink)}
/* hooks + ad copy */
.hook-list{display:flex;flex-direction:column;gap:7px}
.hook-row{display:grid;grid-template-columns:22px 150px 1fr;gap:8px;align-items:center}
.hook-n{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink-3);text-align:center}
.hook-type,.hook-text{font-family:inherit;font-size:13px;color:var(--ink);background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.hook-type{font-weight:600}
.hook-type:focus,.hook-text:focus,.sc-adcopy:focus{outline:2px solid var(--accent);outline-offset:1px}
.sc-adcopy{width:100%;min-height:96px;resize:vertical;font-family:inherit;font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:11px 12px}
.itzik-btn{background:var(--good);border-color:var(--good);box-shadow:0 8px 20px -12px var(--good)}
.itzik-btn:hover{filter:brightness(1.05)}
.itzik-done{color:var(--good-2);font-weight:700}
@media (max-width:680px){.sc-grid{grid-template-columns:1fr}.hook-row{grid-template-columns:18px 110px 1fr}}

/* confirm modal */
.confirm-modal{position:fixed;z-index:73;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;
  width:min(440px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lift);
  padding:26px 26px 22px;text-align:center;transition:opacity .18s,transform .18s}
.confirm-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.cm-icon{font-size:32px;margin-bottom:8px}
.confirm-modal h3{font-size:19px;font-weight:800}
.confirm-modal p{color:var(--ink-2);font-size:13.5px;margin:10px 0 20px;line-height:1.5}
.cm-actions{display:flex;gap:10px;justify-content:center}
.cm-yes{background:var(--good);border-color:var(--good)}
.cm-yes.armed{background:var(--bad);border-color:var(--bad);animation:cmpulse 1s ease infinite}
@keyframes cmpulse{0%,100%{box-shadow:0 0 0 0 var(--bad-soft)}50%{box-shadow:0 0 0 6px var(--bad-soft)}}
#cmScrim{z-index:72}

.need-pill{display:inline-block;font-family:"Archivo",sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--warn-2);background:var(--warn-soft);padding:2px 6px;border-radius:999px;vertical-align:middle;margin-left:7px}
.bstep.flash{animation:needflash 1.5s ease}
@keyframes needflash{0%,100%{background:transparent}20%,55%{background:var(--warn-soft)}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <!-- ============ STAGE RAIL ============ -->
  <aside class="rail">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Altitude</h1>
        <p>Creative operating system</p>
      </div>
    </div>

    <nav aria-label="Weekly stages">
      <ul class="stages" id="stages"></ul>
    </nav>

    <div class="rail-foot">
      <div class="wk" id="weekLabel"></div>
      <button class="ghostbtn" id="openData">⚙︎ Manage products &amp; data</button>
      <button class="ghostbtn" id="newWeek">↻ Start a new week</button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <div class="crumb"><span class="idx" id="crumbIdx">Stage 1</span><span id="crumbName">The Big Picture</span></div>
      <div class="spacer"></div>
      <div class="seg" id="tfSeg" role="group" aria-label="Timeframe">
        <button data-tf="1">Today</button>
        <button data-tf="7" class="on">7 days</button>
        <button data-tf="30">30 days</button>
      </div>
      <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </header>

    <div class="canvas" id="canvas"></div>
  </main>
</div>

<!-- ============ DATA DRAWER ============ -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Manage data">
  <div class="dh">
    <h3>Products &amp; creatives</h3>
    <div class="spacer"></div>
    <button class="iconbtn" id="closeDrawer" aria-label="Close">✕</button>
  </div>
  <div class="db" id="drawerBody"></div>
  <div class="df">
    <button class="btn secondary" id="addProduct">+ Add product</button>
    <button class="btn" id="saveData">Save</button>
  </div>
</aside>

<!-- ============ PRODUCT DETAIL MODAL ============ -->
<div class="pm-scrim" id="pmScrim"></div>
<div class="pmodal" id="pmodal" aria-hidden="true" role="dialog" aria-label="Product angle detail">
  <button class="pm-close" id="pmClose" aria-label="Close">✕</button>
  <div class="pm-body" id="pmBody"></div>
</div>

<!-- ============ CONFIRM MODAL (double-confirm) ============ -->
<div class="pm-scrim" id="cmScrim"></div>
<div class="confirm-modal" id="confirmModal" aria-hidden="true" role="alertdialog">
  <div class="cm-icon">⚠️</div>
  <h3 id="cmTitle">Are you sure?</h3>
  <p id="cmMsg"></p>
  <div class="cm-actions">
    <button class="btn secondary" id="cmCancel">Cancel</button>
    <button class="btn cm-yes" id="cmYes">Yes</button>
  </div>
</div>

<!-- hook-type quick-pick suggestions -->
<datalist id="hookTypes">
  <option>Scarcity</option><option>Urgency</option><option>Question</option><option>Curiosity</option>
  <option>Social Proof</option><option>Fear / Pain</option><option>Bold Claim</option><option>Problem</option>
  <option>Callout</option><option>Statistic</option><option>Story</option><option>Contrarian</option>
  <option>Relatable</option><option>How-to</option>
</datalist>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STATE
   ============================================================ */
const STORE_KEY = "altitude.v2";
const TF_DAYS = {"1":1,"7":7,"30":30};
const TF_LABEL = {"1":"today","7":"last 7 days","30":"last 30 days"};
const uid = () => Math.random().toString(36).slice(2,9);

const STAGES = [
  {n:1,t:"The Big Picture",s:"Winners, losers &amp; the goal"},
  {n:2,t:"Creative Research",s:"Build this week's ads"},
  {n:3,t:"Script Studio",s:"Turn briefs into scripts"},
];

/* ---- seed (SAMPLE data — clearly labelled in UI) ---- */
function buildSeed(){
  // base numbers are 7-day spend/roas; today & 30d derived for a realistic toggle
  const P = (name, creatives)=>({id:uid(),name,creatives:creatives.map(c=>mkCreative(...c))});
  function mkCreative(name, spend7, roas7){
    const j=(x,f)=>Math.max(0,Math.round(x*f));
    const rj=(r,d)=>Math.max(0.2,+(r+d).toFixed(2));
    return {id:uid(),name,windows:{
      "1":{spend:j(spend7,1/7*(0.8+Math.random()*0.5)),roas:rj(roas7,(Math.random()-0.5)*0.5)},
      "7":{spend:spend7,roas:roas7},
      "30":{spend:j(spend7,4.2*(0.9+Math.random()*0.25)),roas:rj(roas7,(Math.random()-0.5)*0.35)},
    }};
  }
  return [
    P("Pink Protocol",[
      ["UGC — Testimonial (Noa)",3800,2.9],
      ["Founder story — 45s",2600,2.4],
      ["Before / After split",1500,3.6],
      ["Problem-agitate hook",2100,1.7],
      ["Static offer carousel",700,1.2],
    ]),
    P("PDRN Booster",[
      ["Science explainer",2400,2.2],
      ["UGC — glow routine",1800,1.5],
      ["Derm authority",1300,2.7],
      ["Trend hook — 15s",1600,1.1],
      ["Us-vs-them comparison",1900,1.8],
    ]),
    P("Retinew",[
      ["How-to-use educational",2000,1.4],
      ["UGC — results at 8 weeks",1400,2.1],
      ["Sensitive-skin angle",1700,1.3],
      ["Ingredient explainer",1100,1.9],
    ]),
    P("LuxeSkin",[
      ["Lifestyle aesthetic",2900,2.5],
      ["Testimonial montage",1600,2.8],
      ["Unboxing UGC",1200,2.0],
      ["Price-justify hook",1500,1.6],
    ]),
    P("NAD9 Kit",[
      ["Longevity angle — edu",2200,1.5],
      ["Podcast clip cut-down",1700,1.3],
      ["Founder rant",900,2.3],
      ["Routine UGC",1400,1.8],
      ["Doctor authority",1200,1.2],
    ]),
    P("Ancestica Solid Bar",[
      ["Sustainability hook",1500,1.6],
      ["ASMR bar demo",1300,2.2],
      ["Zero-waste UGC",1100,1.4],
      ["Comparison vs. bottle",900,1.7],
    ]),
  ];
}

function freshWorkflow(){ return {weekOf:new Date().toISOString(), completed:[]}; }

/* ---- creative research bank (tab 2) ---- */
function freshDraft(carry){
  return Object.assign({productId:null,brandId:null,creativeUrl:"",concept:"",thumb:null,angle:null,
    audience:null,personaId:null,lander:null,editor:null,mediaType:null,hook:"",
    dateCode:liveDateCode(),editingId:null}, carry||{});
}
// personas & angles are GLOBAL banks (loaded from the strategy doc), not fixed per product.
function defaultPersonasFlat(){
  return ["Busy mom 35–45","Perimenopausal skin","Skincare newbie","Aging-concerned 40+",
    "K-beauty enthusiast","Sensitive skin","Retinol-curious beginner","Affluent 40+",
    "Biohacker","Longevity enthusiast","Eco-conscious 25–40"].map(n=>({id:uid(),name:n}));
}
function defaultLanders(){ return ["Quiz","Advertorial","Listicle","Product Page","VSL"]; }
const DEFAULT_ANGLES=["Problem-Aware","Insecurity","Time-Saving","Science / Mechanism","Social Proof",
  "Cost-Per-Use","Ingredient Hero","Routine / Ritual","Anti-Aging Fear","Clean / Natural",
  "Authority / Expert","Transformation","Myth-Busting","FOMO / Trend"];
// a saved strategy = a named doc's angles + personas, kept in the library and assignable per product
function makeStrategy(name, angles, personas, fileName){
  return {id:uid(), name:name||"Strategy", fileName:fileName||null, createdAt:new Date().toISOString(),
    angles:(angles||[]).slice(),
    personas:(personas||[]).map(n=>typeof n==="string"?{id:uid(),name:n}:{id:n.id||uid(),name:n.name})};
}
function defaultStrategy(){ return makeStrategy("Default (sample)", DEFAULT_ANGLES, defaultPersonasFlat(), null); }
function defaultCreative(products){
  const landers={}; products.forEach(p=>landers[p.id]=defaultLanders());
  const def=defaultStrategy();
  const productStrategy={}; products.forEach(p=>productStrategy[p.id]=def.id);
  return {
    weeklyTarget:30,
    strategies:[def],
    productStrategy,
    brands:[
      {id:uid(),name:"Glow Recipe",url:""},{id:uid(),name:"The Ordinary",url:""},
      {id:uid(),name:"Medik8",url:""},{id:uid(),name:"Bubble",url:""},
    ],
    editors:["Lucas","Shahaf"],
    landers,
    ads:[],
    draft:freshDraft(),
  };
}
// share of WINNING spend from NEW customers (Facebook-derived — sample until connected)
const ACQ_SPLIT={"Pink Protocol":0.66,"PDRN Booster":0.58,"Retinew":0.48,"LuxeSkin":0.61,"NAD9 Kit":0.44,"Ancestica Solid Bar":0.55};
function applyAcq(products){ products.forEach(p=>{ if(typeof p.newPct!=="number") p.newPct=(ACQ_SPLIT[p.name]!=null?ACQ_SPLIT[p.name]:0.5); }); }
// per-product angle performance (Facebook-derived — sample until connected). [angle, spend, roas]
function seedAngleData(products){
  const P={
    "Pink Protocol":[["Insecurity",850,2.6],["Transformation",620,2.3],["Social Proof",380,1.6],["Science / Mechanism",150,1.9],["Time-Saving",70,2.1]],
    "PDRN Booster":[["Science / Mechanism",720,2.4],["Authority / Expert",540,2.2],["FOMO / Trend",300,1.3],["Ingredient Hero",180,1.8],["Clean / Natural",90,2.0]],
    "Retinew":[["Ingredient Hero",640,2.1],["Anti-Aging Fear",420,1.5],["Myth-Busting",260,1.7],["Routine / Ritual",140,1.9]],
    "LuxeSkin":[["Transformation",900,2.5],["Social Proof",560,2.4],["Cost-Per-Use",300,1.6],["Clean / Natural",120,2.2]],
    "NAD9 Kit":[["Authority / Expert",680,1.6],["Science / Mechanism",520,1.4],["Problem-Aware",240,1.8],["Transformation",110,2.3]],
    "Ancestica Solid Bar":[["Clean / Natural",560,2.2],["Cost-Per-Use",340,1.5],["Routine / Ritual",190,1.7],["FOMO / Trend",80,1.9]],
  };
  const out={};
  products.forEach(p=>{ out[p.id]={}; (P[p.name]||[]).forEach(([a,s,r])=>out[p.id][a]={spend:s,roas:r}); });
  return out;
}
function defaultState(){
  const products=buildSeed(); applyAcq(products);
  return {
    goal:{dailyTarget:5000, roasThreshold:2.0, angleWin:100, angleLose:200},
    timeframe:"7",
    theme:"system",
    isSample:true,
    products,
    angleData:seedAngleData(products),
    workflow:freshWorkflow(),
    creative:defaultCreative(products),
    scriptFilter:{editor:"all",product:"all",status:"all"},
    view:1,
  };
}
function freshHooks(){ return [0,0,0,0,0,0].map(()=>({type:"",text:""})); }
function freshProduction(){ return {scriptText:"",scriptFile:null,visualsLink:"",instructions:"",hooks:freshHooks(),adCopy:"",sentToEditor:false,frameLink:"",finishedAt:null,pushedToItzik:null}; }
let S = load();
function load(){
  let r=null; try{r=JSON.parse(localStorage.getItem(STORE_KEY));}catch(e){}
  if(!r||!r.products) return defaultState();
  migrate(r); return r;
}
function migrate(s){
  if(!s.workflow) s.workflow=freshWorkflow();
  if(!Array.isArray(s.workflow.completed)) s.workflow.completed=[];
  if(!s.goal) s.goal={dailyTarget:5000,roasThreshold:2.0};
  if(s.goal.angleWin==null) s.goal.angleWin=100;
  if(s.goal.angleLose==null) s.goal.angleLose=200;
  applyAcq(s.products);
  if(!s.angleData||typeof s.angleData!=="object"){ s.angleData=seedAngleData(s.products); }
  s.products.forEach(p=>{ if(!s.angleData[p.id]) s.angleData[p.id]={}; });
  if(!s.creative) s.creative=defaultCreative(s.products);
  const cr=s.creative;
  if(!cr.draft) cr.draft=freshDraft();
  if(!("thumb" in cr.draft)) cr.draft.thumb=null;
  // Yotam is not an editor; ensure Lucas & Shahaf
  cr.editors=(Array.isArray(cr.editors)?cr.editors:[]).filter(e=>String(e).toLowerCase()!=="yotam");
  ["Shahaf","Lucas"].forEach(e=>{ if(!cr.editors.includes(e)) cr.editors.unshift(e); });
  if(cr.draft.editor && !cr.editors.includes(cr.draft.editor)) cr.draft.editor=null;
  // strategies library + per-product assignment (build from any legacy global banks)
  if(!Array.isArray(cr.strategies) || !cr.strategies.length){
    let angles = Array.isArray(cr.angles)&&cr.angles.length ? cr.angles.slice() : DEFAULT_ANGLES.slice();
    let personas;
    if(Array.isArray(cr.personas)&&cr.personas.length){ personas=cr.personas.map(p=>({id:p.id||uid(),name:p.name})); }
    else if(cr.personas && !Array.isArray(cr.personas)){
      const flat=[],seen=new Set();
      Object.values(cr.personas).forEach(list=>(list||[]).forEach(p=>{ if(p&&!seen.has(p.name)){seen.add(p.name);flat.push({id:p.id||uid(),name:p.name});} }));
      personas=flat.length?flat:defaultPersonasFlat();
    } else personas=defaultPersonasFlat();
    const nm=(cr.strategy&&cr.strategy.fileName)?cr.strategy.fileName:"Default (sample)";
    cr.strategies=[makeStrategy(nm, angles, personas, cr.strategy&&cr.strategy.fileName||null)];
  }
  if(!cr.productStrategy||typeof cr.productStrategy!=="object") cr.productStrategy={};
  s.products.forEach(p=>{ if(!cr.productStrategy[p.id] || !cr.strategies.find(st=>st.id===cr.productStrategy[p.id])) cr.productStrategy[p.id]=cr.strategies[0].id; });
  delete cr.angles; delete cr.personas; delete cr.strategy;
  if(cr.draft.productId){
    const st=cr.strategies.find(x=>x.id===cr.productStrategy[cr.draft.productId])||cr.strategies[0];
    if(cr.draft.angle && st && !st.angles.includes(cr.draft.angle)) cr.draft.angle=null;
    if(cr.draft.personaId && st && !(st.personas||[]).find(p=>p.id===cr.draft.personaId)) cr.draft.personaId=null;
  }
  // landers: global array -> per-product object
  if(Array.isArray(cr.landers)){
    const def=cr.landers.slice(); const obj={}; s.products.forEach(p=>obj[p.id]=def.slice()); cr.landers=obj;
  }
  if(!cr.landers||typeof cr.landers!=="object") cr.landers={};
  s.products.forEach(p=>{ if(!Array.isArray(cr.landers[p.id])||!cr.landers[p.id].length) cr.landers[p.id]=defaultLanders(); });
  // Stage 3: every brief gets a production record + a filter store
  (cr.ads||[]).forEach(a=>{ if(!a.production) a.production=freshProduction();
    const pr=a.production;
    if(!Array.isArray(pr.hooks)||pr.hooks.length!==6){ const old=Array.isArray(pr.hooks)?pr.hooks:[]; pr.hooks=[]; for(let i=0;i<6;i++) pr.hooks[i]={type:(old[i]&&old[i].type)||"",text:(old[i]&&old[i].text)||""}; }
    if(typeof pr.adCopy!=="string") pr.adCopy="";
    if(!("pushedToItzik" in pr)) pr.pushedToItzik=null;
  });
  if(!s.scriptFilter||typeof s.scriptFilter!=="object") s.scriptFilter={editor:"all",product:"all",status:"all"};
  if(typeof s.view!=="number"||s.view<1||s.view>STAGES.length) s.view=1;
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}}

/* ============================================================
   COMPUTE — the engine
   ============================================================ */
const money=(n)=>"$"+Math.round(n).toLocaleString("en-US");
const moneyK=(n)=> n>=1000 ? "$"+(n/1000).toFixed(n>=10000?0:1)+"K" : "$"+Math.round(n);
const tf=()=>S.timeframe;
const days=()=>TF_DAYS[tf()];
const thr=()=>S.goal.roasThreshold;

function creativeMetric(c){const w=c.windows[tf()]||{spend:0,roas:0};return {spend:w.spend||0,roas:w.roas||0};}

function productStats(p){
  let wCount=0,lCount=0,wSpend=0,lSpend=0,wRev=0,lRev=0,near=0,nearSpend=0,scaleHead=0;
  const list=p.creatives.map(c=>{
    const m=creativeMetric(c); const isWin=m.roas>=thr();
    const rev=m.spend*m.roas;
    if(isWin){wCount++;wSpend+=m.spend;wRev+=rev; if(m.roas>=thr()+0.5) scaleHead+=m.spend*(m.roas-thr());}
    else{lCount++;lSpend+=m.spend;lRev+=rev; if(m.roas>=thr()-0.4){near++;nearSpend+=m.spend;}}
    return {...c,...m,rev,isWin};
  });
  const totSpend=wSpend+lSpend;
  const avgWinRoas=wCount?wRev/wSpend:0;
  return {p,list,wCount,lCount,wSpend,lSpend,wRev,lRev,totSpend,near,nearSpend,scaleHead,avgWinRoas,
    winRatio:totSpend?wSpend/totSpend:0};
}
function allStats(){return S.products.map(productStats);}

function accountRollup(){
  const st=allStats();
  const wSpend=st.reduce((a,s)=>a+s.wSpend,0);
  const lSpend=st.reduce((a,s)=>a+s.lSpend,0);
  const wRev=st.reduce((a,s)=>a+s.wRev,0);
  const d=days();
  return {
    st,
    profitableDaily:wSpend/d,
    unprofitableDaily:lSpend/d,
    totalDaily:(wSpend+lSpend)/d,
    profitablePct:(wSpend/d)/S.goal.dailyTarget,
    efficiency:(wSpend+lSpend)? wSpend/(wSpend+lSpend):0,
    blendedWinRoas:wSpend?wRev/wSpend:0,
    winners:st.reduce((a,s)=>a+s.wCount,0),
    losers:st.reduce((a,s)=>a+s.lCount,0),
  };
}

/* ---- angle intelligence: status per product from Facebook-derived spend/roas ---- */
const ANGLE_STATUS={winning:{label:"Winning",cls:"winning",sig:"✓"},losing:{label:"Losing",cls:"losing",sig:"✕"},testing:{label:"Testing",cls:"testing",sig:"•"},untested:{label:"Untested",cls:"untested",sig:"+"}};
function angleStatusFor(pid, angle){
  const st=(S.angleData[pid]||{})[angle];
  const t=thr(), wS=S.goal.angleWin||100, lS=S.goal.angleLose||200;
  if(!st) return {key:"untested",spend:0,roas:0};
  if(st.roas>=t && st.spend>=wS) return {key:"winning",spend:st.spend,roas:st.roas};
  if(st.roas<t && st.spend>=lS) return {key:"losing",spend:st.spend,roas:st.roas};
  return {key:"testing",spend:st.spend,roas:st.roas};
}
function angleBreakdown(pid){
  const data=S.angleData[pid]||{};
  const rank={winning:0,testing:1,untested:2,losing:3};
  return Object.keys(data).map(a=>{const s=angleStatusFor(pid,a);return {angle:a,...s};})
    .sort((x,y)=> (rank[x.key]-rank[y.key]) || (y.spend-x.spend));
}
function productAcq(p){ const n=typeof p.newPct==="number"?p.newPct:0.5; return {newPct:n, retPct:1-n}; }

/* ---- recommendation engine: score plays, tie to product ---- */
function buildRecommendations(){
  const d=days(); const roll=accountRollup(); const opps=[];
  roll.st.forEach(s=>{
    if(s.totSpend<1) return;
    // CUT losers — impact = daily unprofitable spend freed
    if(s.lSpend>0) opps.push({
      play:"cut", product:s.p.name, productId:s.p.id, score:s.lSpend*1.0,
      impact:s.lSpend/d, impactLabel:"/day freed",
      title:`Cut the losers on ${s.p.name}`,
      why:`<b>${s.lCount} creatives</b> under ${thr().toFixed(1)} ROAS are burning <b>${money(s.lSpend/d)}/day</b>. Kill them and redeploy the budget to what already works.`
    });
    // SCALE winners with headroom
    if(s.scaleHead>0) opps.push({
      play:"scale", product:s.p.name, productId:s.p.id, score:s.scaleHead*1.15,
      impact:s.wSpend/d, impactLabel:"winner spend now",
      title:`Pour volume into ${s.p.name} winners`,
      why:`Winners here run at <b>${s.avgWinRoas.toFixed(2)} ROAS</b> — well above target with room to scale. Push budget up while it holds.`
    });
    // MORE winners — loser-heavy / thin winner base
    if(s.winRatio<0.5 || s.wCount<=1) opps.push({
      play:"more", product:s.p.name, productId:s.p.id, score:(0.55-s.winRatio)*Math.max(s.totSpend,3000)*1.2 + (s.wCount<=1?4000:0),
      impact:s.winRatio, impactLabel:"profitable spend",
      title:`Get more winners on ${s.p.name}`,
      why:`Only <b>${Math.round(s.winRatio*100)}%</b> of spend here is profitable (${s.wCount} winner${s.wCount===1?"":"s"}). Test fresh angles to widen the winning base.`
    });
    // ITERATE near-winners
    if(s.near>0) opps.push({
      play:"iterate", product:s.p.name, productId:s.p.id, score:s.nearSpend*0.8,
      impact:s.nearSpend/d, impactLabel:"on the cusp",
      title:`Iterate the near-misses on ${s.p.name}`,
      why:`<b>${s.near} creatives</b> sit just under ${thr().toFixed(1)} ROAS — closest to flipping to winners. New hooks/edits on proven angles beat starting from scratch.`
    });
  });
  opps.sort((a,b)=>b.score-a.score);
  // de-dupe so top 3 aren't all the same product unless it dominates
  const out=[]; const seen={};
  for(const o of opps){seen[o.productId]=(seen[o.productId]||0); if(seen[o.productId]<2){out.push(o);seen[o.productId]++;} if(out.length>=3)break;}
  while(out.length<3 && opps.length>out.length){for(const o of opps){if(!out.includes(o)){out.push(o);break;}}}
  return out.slice(0,3);
}
const PLAY=({cut:{cls:"cut",label:"Cut losers"},scale:{cls:"scale",label:"Scale winners"},more:{cls:"more",label:"Get more winners"},iterate:{cls:"iterate",label:"Iterate"}});

/* ---- strategy doc: extract angles & personas ---- */
function uniqCI(a){const s=new Set(),o=[];a.forEach(x=>{const k=String(x).toLowerCase();if(x&&!s.has(k)){s.add(k);o.push(x);}});return o;}
function toArr(v){return Array.isArray(v)?v.map(x=>typeof x==="string"?x:(x&&x.name)||"").filter(Boolean):[];}
function headFor(l){
  const s=l.toLowerCase().replace(/[:#*_>\-]/g,"").trim();
  if(/^(angles?|creative angles?|messaging angles?|marketing angles?)$/.test(s)) return "angles";
  if(/^(personas?|hero personas?|avatars?|customer avatars?|target personas?|characters?)$/.test(s)) return "personas";
  return null;
}
function parseStrategy(text){
  text=String(text||"");
  try{const j=JSON.parse(text); if(j&&(j.angles||j.personas)) return {angles:uniqCI(toArr(j.angles)),personas:uniqCI(toArr(j.personas))};}catch(e){}
  const out={angles:[],personas:[]}; let mode=null;
  text.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim(); if(!l) return;
    const inline=l.match(/^([#>*\-\s]*)([A-Za-z][A-Za-z \/]{2,32}?)\s*:\s*(.+)$/);
    if(inline){ const h=headFor(inline[2]); if(h){ inline[3].split(/[,;]|\s\|\s/).map(x=>x.replace(/^[-*•\d.)\]\s]+/,"").trim()).filter(Boolean).forEach(v=>{if(v.length<=60)out[h].push(v);}); mode=h; return; } }
    const h=headFor(l);
    if(h){ mode=h; return; }
    if(mode){ const item=l.replace(/^[-*•\d.)\]\s]+/,"").trim(); if(item&&item.length<=60) out[mode].push(item); }
  });
  return {angles:uniqCI(out.angles),personas:uniqCI(out.personas)};
}
// save a parsed strategy into the library (optionally assign to the current product)
function saveStrategy(name, parsed, fileName){
  const cr=C();
  if(!parsed.angles.length && !parsed.personas.length){ toast("No angles or personas found — check the doc format"); return; }
  const strat=makeStrategy(name || fileName || ("Strategy "+(cr.strategies.length+1)), parsed.angles, parsed.personas, fileName);
  cr.strategies.push(strat);
  const pid=cr.draft.productId;
  if(pid){ assignStrategy(pid, strat.id); toast(`Saved “${strat.name}” — set for ${productById(pid).name}`); }
  else { save(); renderResearch(); toast(`Saved “${strat.name}” — ${strat.angles.length} angles · ${strat.personas.length} personas`); }
}
function assignStrategy(pid, sid){
  const cr=C(); cr.productStrategy[pid]=sid;
  const st=strategyById(sid);
  if(cr.draft.productId===pid){
    if(cr.draft.angle && st && !st.angles.includes(cr.draft.angle)) cr.draft.angle=null;
    if(cr.draft.personaId && st && !(st.personas||[]).find(p=>p.id===cr.draft.personaId)) cr.draft.personaId=null;
  }
  save(); renderResearch();
}
function deleteStrategy(sid){
  const cr=C();
  if(cr.strategies.length<=1){ toast("Keep at least one strategy"); return; }
  cr.strategies=cr.strategies.filter(s=>s.id!==sid);
  const fallback=cr.strategies[0].id;
  Object.keys(cr.productStrategy).forEach(pid=>{ if(cr.productStrategy[pid]===sid) cr.productStrategy[pid]=fallback; });
  save(); renderResearch(); toast("Strategy removed");
}

/* ---- creative thumbnail (downscaled to a small data URL) ---- */
function fileToThumb(file,cb){
  if(!file){cb(null);return;}
  const r=new FileReader();
  r.onload=()=>{ const img=new Image();
    img.onload=()=>{ const max=260; let w=img.width,h=img.height; const sc=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL("image/jpeg",0.72)); }catch(e){ cb(null); } };
    img.onerror=()=>cb(null); img.src=r.result; };
  r.onerror=()=>cb(null); r.readAsDataURL(file);
}

/* ---- brief score: predicted win probability, 1-10 ---- */
function computeScore(d){
  if(!draftComplete(d)) return null;
  const factors=[];
  // Angle (max 4) — tied to real performance on this product
  const as=angleStatusFor(d.productId,d.angle);
  let aPts,aNote;
  if(as.key==="winning"){aPts=4;aNote="Proven winning angle — double down";}
  else if(as.key==="untested"){aPts=3.2;aNote="Fresh angle — a new test with real upside";}
  else if(as.key==="testing"){aPts=2.4;aNote="Angle still in testing — you're iterating on it";}
  else {aPts=1;aNote="This angle has lost before on this product";}
  let freshJuice=false;
  if(as.key==="testing"||as.key==="losing"){
    const prior=new Set(C().ads.filter(a=>a.productId===d.productId&&a.angle===d.angle&&a.id!==d.editingId).map(a=>a.brandId));
    if(d.brandId&&!prior.has(d.brandId)){aPts=Math.min(4,aPts+0.6);freshJuice=true;aNote+=" · new inspiration brings fresh juice";}
    else if(as.key==="losing"){aNote+=" · same inspiration as before — no fresh juice";}
  }
  factors.push({k:"Angle",pts:aPts,max:4,note:aNote});
  // Audience ↔ goal fit (max 3) — matched to what the product needs on the Big Picture
  const ps=productStats(productById(d.productId));
  let auPts,auNote;
  if(ps.winRatio<0.5){
    if(d.audience==="COLD"){auPts=3;auNote="Product needs new winners — cold acquisition fits the goal";}
    else if(d.audience==="REPEAT"){auPts=1.3;auNote="Product is bleeding — retargeting buyers won't grow it";}
    else{auPts=2.1;auNote="Warm re-engagement — moderate fit for a struggling product";}
  } else {
    if(d.audience==="COLD"){auPts=2.8;auNote="Strong product — scale it with new acquisition";}
    else if(d.audience==="REPEAT"){auPts=2.5;auNote="Healthy base — resell to existing buyers";}
    else{auPts=2.4;auNote="Warm audience — a solid fit";}
  }
  factors.push({k:"Audience fit",pts:auPts,max:3,note:auNote});
  // Craft (max 3)
  let cPts=0; const cn=[];
  if(d.brandId&&d.creativeUrl){cPts+=1.6;cn.push("modelled on a real creative");}
  if(d.concept){cPts+=0.5;cn.push("format defined");}
  if(d.thumb){cPts+=0.5;cn.push("reference attached");}
  if(d.hook){cPts+=0.4;}
  cPts=Math.min(3,cPts);
  factors.push({k:"Craft",pts:cPts,max:3,note:cn.join(" · ")||"basics only"});
  let score=Math.max(1,Math.min(10,Math.round(aPts+auPts+cPts)));
  // a proven-losing angle can't read as a safe bet, however strong the rest is
  if(as.key==="losing") score=Math.min(score, freshJuice?6:5);
  const label=score>=8?"Strong bet":score>=6?"Solid — worth building":score>=4?"Speculative — test it":"Risky — reconsider";
  const tone=score>=6?"good":score>=4?"warn":"bad";
  return {score,label,tone,factors,angleKey:as.key};
}
const scoreTone=(n)=>n>=6?"good":n>=4?"warn":"bad";
function scorePanel(d){
  const sc=computeScore(d);

  const bars=sc.factors.map(f=>`<div class="sf">
    <div class="sf-h"><span>${f.k}</span><span class="mono">${(+f.pts.toFixed(1))}/${f.max}</span></div>
    <div class="sf-bar"><i style="width:${Math.round(f.pts/f.max*100)}%"></i></div>
