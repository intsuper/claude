function bindScript(){
  $$("[data-filter]").forEach(b=>b.onclick=()=>{ S.scriptFilter[b.dataset.filter]=b.dataset.val; save(); renderScript(); });
  const P=(id)=>{ const a=adById(id); if(!a.production)a.production=freshProduction(); return a; };
  $$("[data-scfile]").forEach(inp=>inp.onchange=(e)=>{ const f=e.target.files[0]; if(!f)return; const a=P(inp.dataset.scfile);
    a.production.scriptFile={name:f.name,size:f.size,type:f.type};
    if(/\.(txt|md|markdown|rtf)$/i.test(f.name)||/^text\//.test(f.type)){ const r=new FileReader(); r.onload=()=>{a.production.scriptText=String(r.result||"");save();renderScript();}; r.readAsText(f); }
    else { save(); renderScript(); toast("Script attached"); } });
  $$("[data-scpaste]").forEach(b=>b.onclick=()=>{ const t=document.querySelector('[data-scpastetext="'+b.dataset.scpaste+'"]'); if(t){ t.hidden=!t.hidden; if(!t.hidden)t.focus(); } });
  $$("[data-scpastetext]").forEach(t=>{ t.oninput=()=>{ P(t.dataset.scpastetext).production.scriptText=t.value; save(); }; t.onblur=()=>renderScript(); });
  $$("[data-scview]").forEach(b=>b.onclick=()=>viewScript(b.dataset.scview));
  $$("[data-scclear]").forEach(b=>b.onclick=()=>{ const a=P(b.dataset.scclear); a.production.scriptText=""; a.production.scriptFile=null; save(); renderScript(); });
  $$("[data-scedit]").forEach(b=>b.onclick=()=>{ const a=P(b.dataset.scedit); a.editor=b.dataset.ed; a.naming=namingFor(a); save(); renderScript(); });
  $$("[data-scvlink]").forEach(i=>i.oninput=()=>{ P(i.dataset.scvlink).production.visualsLink=i.value; save(); });
  $$("[data-scvinstr]").forEach(i=>i.oninput=()=>{ P(i.dataset.scvinstr).production.instructions=i.value; save(); });
  $$("[data-scsend]").forEach(b=>b.onclick=()=>{ const a=P(b.dataset.scsend);
    if(!hasScript(a.production)){ toast("Attach or paste a script first"); return; }
    if(!a.editor){ toast("Tag an editor first"); return; }
    a.production.sentToEditor=true; save(); renderScript(); toast("Sent to "+a.editor+" — ready to edit"); });
  $$("[data-scframe]").forEach(i=>i.oninput=()=>{ P(i.dataset.scframe).production.frameLink=i.value; save(); });
  $$("[data-scfinish]").forEach(b=>b.onclick=()=>{ const a=P(b.dataset.scfinish);
    if(!a.production.frameLink||!a.production.frameLink.trim()){ toast("Paste the Frame link first"); return; }
    a.production.finishedAt=new Date().toISOString(); save(); renderScript(); toast("Ready for Launch 🚀"); });
  $$("[data-scback]").forEach(b=>b.onclick=()=>{ P(b.dataset.scback).production.sentToEditor=false; save(); renderScript(); });
  $$("[data-screopen]").forEach(b=>b.onclick=()=>{ P(b.dataset.screopen).production.finishedAt=null; save(); renderScript(); });
  $$("[data-scopy]").forEach(b=>b.onclick=()=>copyText(adById(b.dataset.scopy).brief));
  // hooks (6) + ad copy — save on input, no re-render (keep focus)
  $$("[data-hooktype]").forEach(i=>i.oninput=()=>{ P(i.dataset.hooktype).production.hooks[+i.dataset.hi].type=i.value; save(); });
  $$("[data-hooktext]").forEach(i=>i.oninput=()=>{ P(i.dataset.hooktext).production.hooks[+i.dataset.hi].text=i.value; save(); });
  $$("[data-adcopy]").forEach(i=>i.oninput=()=>{ P(i.dataset.adcopy).production.adCopy=i.value; save(); });
  // Push to Itzik — guarded double-confirm
  $$("[data-scitzik]").forEach(b=>b.onclick=()=>{ const a=P(b.dataset.scitzik);
    if(!a.production.adCopy||!a.production.adCopy.trim()){ toast("Add the ad copy before pushing to Itzik"); return; }
    confirmAction("Push to Itzik?","This sends the full brief, final creative, ad copy and audience to Itzik on Slack to launch on Facebook. Make sure everything is final.","Yes, push to Itzik",()=>pushToItzik(a.id));
  });
  $$("[data-scitzikview]").forEach(b=>b.onclick=()=>showItzikMessage(adById(b.dataset.scitzikview)));
}

/* ---------------- shared bits ---------------- */
function sampleBanner(){
  return `<div class="sample-banner">
    <span>📊</span><span><b>Your products are loaded.</b> The spend &amp; ROAS below are placeholder numbers so the board visualizes — connect Facebook (coming soon) or edit them to make the picture real.</span>
    <button class="btn secondary" id="editSample" style="padding:7px 12px;font-size:12.5px">Edit numbers →</button>
  </div>`;
}
function bindSampleBanner(){const b=$("#editSample");if(b)b.onclick=openDrawer;}
function completeStage(n){if(!S.workflow.completed.includes(n))S.workflow.completed.push(n);save();}
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   DATA DRAWER (edit products / creatives for active timeframe)
   ============================================================ */
let draft=null;
function openDrawer(){
  draft=JSON.parse(JSON.stringify(S.products));
  renderDrawer();
  $("#scrim").classList.add("open");$("#drawer").classList.add("open");$("#drawer").setAttribute("aria-hidden","false");
}
function closeDrawer(){$("#scrim").classList.remove("open");$("#drawer").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true");}
function renderDrawer(){
  const body=$("#drawerBody");const t=tf();
  body.innerHTML=`<p style="font-size:12.5px;color:var(--ink-3);margin:0">Editing <b style="color:var(--ink)">${TF_LABEL[t]}</b> numbers — switch the timeframe up top to edit other windows. Spend in $, ROAS as a multiple (e.g. 2.4).</p>`+
  draft.map((p,pi)=>`
    <div class="prod-edit">
      <div class="pe-head">
        <input type="text" value="${esc(p.name)}" data-pi="${pi}" class="pname-input" style="font-weight:600"/>
        <button class="xbtn" data-delp="${pi}" title="Remove product">🗑</button>
      </div>
      <div class="cr-row"><span class="mini">Creative</span><span class="mini">Spend ($)</span><span class="mini">ROAS</span><span></span></div>
      ${p.creatives.map((c,ci)=>`<div class="cr-row">
        <input type="text" value="${esc(c.name)}" data-pi="${pi}" data-ci="${ci}" data-f="name"/>
        <input type="number" class="mono" value="${Math.round(c.windows[t].spend)}" data-pi="${pi}" data-ci="${ci}" data-f="spend" min="0" step="50"/>
        <input type="number" class="mono" value="${(+c.windows[t].roas).toFixed(2)}" data-pi="${pi}" data-ci="${ci}" data-f="roas" min="0" step="0.1"/>
        <button class="xbtn" data-delc="${pi}.${ci}" title="Remove">✕</button>
      </div>`).join("")}
      <button class="addlink" data-addc="${pi}">+ Add creative</button>
    </div>`).join("");
  // bind
  $$(".pname-input").forEach(i=>i.oninput=()=>draft[+i.dataset.pi].name=i.value);
  $$('.cr-row input[data-f]').forEach(i=>i.oninput=()=>{
    const p=draft[+i.dataset.pi],c=p.creatives[+i.dataset.ci],f=i.dataset.f;
    if(f==="name")c.name=i.value; else c.windows[t][f]=Math.max(0,+i.value||0);
  });
  $$("[data-delp]").forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.delp,1);renderDrawer();});
  $$("[data-delc]").forEach(b=>b.onclick=()=>{const[pi,ci]=b.dataset.delc.split(".").map(Number);draft[pi].creatives.splice(ci,1);renderDrawer();});
  $$("[data-addc]").forEach(b=>b.onclick=()=>{
    const pi=+b.dataset.addc;
    draft[pi].creatives.push({id:uid(),name:"New creative",windows:{"1":{spend:0,roas:0},"7":{spend:0,roas:0},"30":{spend:0,roas:0}}});
    renderDrawer();
  });
}
$("#addProduct").onclick=()=>{if(!draft)draft=[];draft.push({id:uid(),name:"New product",creatives:[{id:uid(),name:"New creative",windows:{"1":{spend:0,roas:0},"7":{spend:0,roas:0},"30":{spend:0,roas:0}}}]});renderDrawer();};
$("#saveData").onclick=()=>{
  S.products=draft; S.isSample=false;
  // prune decisions/focus that no longer exist
  save();closeDrawer();render();toast("Data saved");
};
$("#openData").onclick=openDrawer;
$("#closeDrawer").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#pmClose").onclick=closeProductDetail;
$("#pmScrim").onclick=closeProductDetail;
$("#cmCancel").onclick=closeConfirm;
$("#cmScrim").onclick=closeConfirm;
$("#cmYes").onclick=()=>{
  if(!_cmArmed){ _cmArmed=true; const y=$("#cmYes"); y.classList.add("armed"); y.textContent="Click again to confirm"; return; }
  const f=_confirmYes; closeConfirm(); if(f) f();
};
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape"){closeProductDetail();closeDrawer();closeConfirm();} });

/* ============================================================
   CONTROLS
   ============================================================ */
$$("#tfSeg button").forEach(b=>b.onclick=()=>{S.timeframe=b.dataset.tf;save();render();});
function newWeek(){
  S.workflow=freshWorkflow();
  S.creative.ads=[]; S.creative.draft=freshDraft();
  S.view=1;save();render();toast("New week — board relocked, ad list cleared");
}
$("#newWeek").onclick=()=>{if(confirm("Start a fresh week? Your products, numbers and banks (brands, angles, personas) stay. The board relocks and this week's ad list is cleared."))newWeek();};

/* theme */
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);
}
$("#themeBtn").onclick=()=>{
  const order=["system","light","dark"];const cur=order.indexOf(S.theme);
  S.theme=order[(cur+1)%3];save();applyTheme();toast("Theme: "+S.theme);
};

/* toast */
let toastT;
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2200);}

/* boot */
applyTheme();
if(!stageUnlocked(S.view))S.view=1;
render();
</script>
</body>
</html>
